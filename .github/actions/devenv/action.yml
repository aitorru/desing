name: Set up devenv
description: Nix + cachix + devenv, with the pnpm store cached
runs:
  using: composite
  steps:
    - uses: cachix/install-nix-action@v31
    - uses: cachix/cachix-action@v17
      with:
        name: devenv
    - name: Install devenv
      shell: bash
      run: nix profile install nixpkgs#devenv
    - name: pnpm store path
      id: pnpm
      shell: bash
      run: echo "store=$(devenv shell -- pnpm store path --silent | tail -n1)" >> "$GITHUB_OUTPUT"
    - uses: actions/cache@v6
      with:
        path: ${{ steps.pnpm.outputs.store }}
        key: ${{ runner.os }}-pnpm-${{ hashFiles('pnpm-lock.yaml', 'devenv.lock') }}
        restore-keys: |
          ${{ runner.os }}-pnpm-
