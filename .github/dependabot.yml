version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    groups:
      storybook:
        patterns: ["storybook", "@storybook/*"]
      npm:
        patterns: ["*"]
    ignore:
      # Must match nixpkgs' biome (BIOME_BINARY); bump it together with devenv.lock.
      - dependency-name: "@biomejs/biome"
